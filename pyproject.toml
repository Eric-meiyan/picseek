[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "picseek"
version = "0.1.0"
description = "Local image semantic search — Everything for pictures"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Eric-meiyan", email = "678378@qq.com"},
]
keywords = ["image-search", "semantic-search", "clip", "chinese-clip", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "Pillow>=9.0.0",
    "sqlite-vec>=0.1.1",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.60.0",
]

[project.urls]
Homepage = "https://github.com/Eric-meiyan/picseek"
Repository = "https://github.com/Eric-meiyan/picseek"
Issues = "https://github.com/Eric-meiyan/picseek/issues"

[project.scripts]
picseek = "picseek.cli:main"

[tool.setuptools.packages.find]
include = ["picseek*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
