[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "picseek"
version = "0.1.0"
description = "Local image semantic search — Everything for pictures"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "Pillow>=9.0.0",
    "sqlite-vec>=0.1.1",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.60.0",
]

[project.scripts]
picseek = "picseek.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
